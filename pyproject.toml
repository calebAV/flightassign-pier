[project]
name = "flightassign-pier"
version = "0.1.0"
description = "Pier-grouped view of ATL outbound flights, posted to Slack every 20 minutes."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "slack-sdk>=3.27.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
flightassign-pier = "flightassign_pier.__main__:main"
